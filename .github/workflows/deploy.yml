name: Release to GitHub Pages

on:
  release:
    types: [published]

permissions:
  contents: write # attach the SCORM zip to the release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # tests use Node's built-in type stripping
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:scorm # built without the download link, for the LMS
      - run: gh release upload "$TAG" pc-builder-scorm.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
      - run: npm run build
        env:
          VITE_SCORM_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/pc-builder-scorm.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
